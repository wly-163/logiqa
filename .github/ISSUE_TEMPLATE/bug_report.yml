name: 缺陷报告
description: 功能不正常或报错
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿在此粘贴 API Key、密码或生产数据。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      placeholder: 实际结果 vs 期望结果
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: 1. … 2. … 3. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: 例如 Docker Compose / Python 3.11 / 浏览器
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可打码）
      render: text
